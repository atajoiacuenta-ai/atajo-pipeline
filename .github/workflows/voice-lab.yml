name: voice-lab
# Banco de pruebas de voz. NO publica nada. Sube WAVs como artefacto para escucharlos.
on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Motores separados por coma: edge:+15%, edge:+25%, chatterbox_es, chatterbox_es_m"
        default: "edge:+15%,edge:+25%,chatterbox_es,chatterbox_es_m"
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg git-lfs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v2
      - name: Dependencias
        run: |
          pip install --quiet soundfile numpy edge-tts
          if echo "${{ inputs.engines }}" | grep -q chatterbox; then
            pip install --quiet torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet numpy==1.26.0 resampy==0.4.3 librosa==0.10.0 transformers==4.46.3 diffusers==0.29.0 \
              omegaconf==2.3.0 resemble-perth==1.0.1 silero-vad==5.1.2 conformer==0.3.2 s3tokenizer safetensors huggingface_hub
            git clone --depth 1 https://huggingface.co/spaces/ResembleAI/Chatterbox-Multilingual-TTS-es-es space
            ls space/chatterbox/src/chatterbox
            mkdir -p refs
            curl -fsSL -o refs/es_es_f1.wav https://storage.googleapis.com/chatterbox-demo-samples/mtl-v3-single-language-prompts/es-es/es_es_f1.wav
            curl -fsSL -o refs/es_m1.flac https://storage.googleapis.com/chatterbox-demo-samples/mtl_prompts/es_m1.flac
          fi
      - name: Generar
        continue-on-error: true
        run: |
          mkdir -p out
          for e in $(echo "${{ inputs.engines }}" | tr ',' ' '); do
            d=$(echo "$e" | tr ':+%' '_pP')
            echo "::group::$e"
            python scripts/voice_lab.py "$e" "out/$d" 2>&1 | tee "out/$d.log" || echo "FALLO $e"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: voice-lab
          path: out/
