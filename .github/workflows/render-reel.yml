name: render-reel
# Genera voz (Chatterbox es-ES, referencia sharvard) + vídeo de un Reel y lo sube como artefacto. NO publica nada.
on:
  workflow_dispatch:
    inputs:
      content:
        description: "Ruta del guion JSON"
        default: "content/001.json"
      tempo:
        description: "Velocidad de la voz (1.0 natural, 1.1 = 10% más rápida)"
        default: "1.0"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v2
      - name: Dependencias
        run: |
          pip install --quiet soundfile Pillow
          pip install --quiet torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy==1.26.0 resampy==0.4.3 librosa==0.10.0 transformers==4.46.3 diffusers==0.29.0 \
            omegaconf==2.3.0 resemble-perth==1.0.1 silero-vad==5.1.2 conformer==0.3.2 s3tokenizer safetensors huggingface_hub
          git clone --depth 1 https://huggingface.co/spaces/ResembleAI/Chatterbox-Multilingual-TTS-es-es space
      - name: Voz
        env:
          TEMPO: ${{ inputs.tempo }}
        run: python scripts/voice_cb.py "${{ inputs.content }}" chatterbox
      - name: Vídeo
        env:
          VOICE: chatterbox
        run: python scripts/reel_v3.py render
      - name: Reunir resultados
        env:
          C: ${{ inputs.content }}
        run: |
          mkdir -p result
          cp out/reel-v3/chatterbox/reel_v3.mp4 result/reel.mp4
          cp out/voice-v3/chatterbox/voice.wav result/voice.wav
          cp out/voice-v3/chatterbox/meta.json result/meta.json
          cp "$C" result/guion.json
          cp "${C%.json}.caption.txt" result/caption.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: result/
