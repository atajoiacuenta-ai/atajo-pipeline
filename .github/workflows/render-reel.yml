name: render-reel
# Genera voz (Chatterbox es-ES, referencia sharvard) + vídeo de uno o varios Reels y los sube como artefacto. NO publica nada.
on:
  workflow_dispatch:
    inputs:
      contents:
        description: "Guiones JSON separados por espacio"
        default: "content/002.json content/003.json content/004.json content/005.json content/006.json"
      tempo:
        description: "Velocidad de la voz (1.0 natural, 1.1 = 10% más rápida)"
        default: "1.0"
      exag:
        description: "Expresividad (exaggeration): 0.5 normal, 0.7 más expresiva"
        default: "0.5"
      cfg:
        description: "cfg_weight: 0.5 normal, 0.3 más pausada y natural"
        default: "0.5"
      temp:
        description: "Temperatura: 0.8 normal, 1.0 más variación"
        default: "0.8"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v2
      - name: Dependencias
        run: |
          pip install --quiet soundfile Pillow
          pip install --quiet torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy==1.26.0 resampy==0.4.3 librosa==0.10.0 transformers==4.46.3 diffusers==0.29.0 \
            omegaconf==2.3.0 resemble-perth==1.0.1 silero-vad==5.1.2 conformer==0.3.2 s3tokenizer safetensors huggingface_hub
          git clone --depth 1 https://huggingface.co/spaces/ResembleAI/Chatterbox-Multilingual-TTS-es-es space
      - name: Voz (el modelo se carga una vez)
        env:
          TEMPO: ${{ inputs.tempo }}
          EXAG: ${{ inputs.exag }}
          CFG: ${{ inputs.cfg }}
          TEMP: ${{ inputs.temp }}
        run: python scripts/voice_cb.py ${{ inputs.contents }}
      - name: Vídeo y resultados
        run: |
          mkdir -p result
          for c in ${{ inputs.contents }}; do
            id=$(python -c "import json,sys;print(json.load(open('$c'))['id'])")
            python scripts/reel.py render "$c"
            mkdir -p "result/$id"
            cp "out/reel/$id/reel.mp4" "result/$id/reel.mp4"
            cp "out/voice-v3/$id/voice.wav" "result/$id/voice.wav"
            cp "$c" "result/$id/guion.json"
            cp "${c%.json}.caption.txt" "result/$id/caption.txt" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: result/
